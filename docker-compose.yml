services:
  # ── MongoDB ───────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    hostname: mongo
    networks:
      - portfolio
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Server (Express API) ──────────────────────────────────────────────────────
  server:
    image: ghcr.io/maulik-sharma/portfolio-server:latest
    container_name: server
    restart: unless-stopped
    hostname: server
    networks:
      - portfolio
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/portfolio}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
    depends_on:
      mongo:
        condition: service_healthy

  # ── Client (React SPA) ────────────────────────────────────────────────────────
  client:
    image: ghcr.io/maulik-sharma/portfolio-client:latest
    container_name: client
    hostname: client
    networks:
      - portfolio
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server

volumes:
  mongo_data:

networks:
  portfolio:
    name: portfolio
    external: false
